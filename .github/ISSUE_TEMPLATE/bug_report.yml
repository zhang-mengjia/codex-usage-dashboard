name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove account details, conversation content, and tokens from logs and screenshots.
  - type: input
    id: dashboard-version
    attributes:
      label: Dashboard version
      placeholder: 1.1.1
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and ChatGPT/Codex versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
