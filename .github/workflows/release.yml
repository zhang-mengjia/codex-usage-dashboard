name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pack:mac
      - name: Verify universal app bundle
        shell: bash
        run: |
          app_path="$(find release/mac-universal -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app_path"
          archs="$(lipo -archs "$app_path/Contents/MacOS/Codex 使用量")"
          echo "Architectures: $archs"
          grep -q "x86_64" <<< "$archs"
          grep -q "arm64" <<< "$archs"
          test -f "$app_path/Contents/Resources/app.asar"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Write SHA-256 checksums
        shell: bash
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release/* --repo "$GITHUB_REPOSITORY" --title "Codex Usage Dashboard $tag" --generate-notes
          fi
